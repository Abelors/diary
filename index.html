<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Diary</title>
<style>
  :root { --bg: #161618; --card: #1f1f23; --input: #141416; --border: #2e2e34; --text: #f0f0f3; --muted: #9ca3af; --accent: #9b6bcc; --accent-bg: rgba(155,107,204,.25); --accent-bd: rgba(155,107,204,.45); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 14px 50px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 16px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .tab.active { color: #fff; border-color: var(--accent); background: var(--accent-bg); }
  .top-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .head-bar { display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 18px; font-weight: 800; }
  .badge { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-bd); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .row-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input, select { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  .toggle { background: var(--input); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .toggle.active { border-color: #00e054; color: #00e054; background: rgba(0,224,84,.08); }
  .reset { background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 7px; padding: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .reset:hover { border-color: var(--accent); color: var(--accent); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .cal-pickers { display: flex; gap: 5px; }
  .cal-sel { padding: 3px 7px; font-size: 12px; font-weight: 700; }
  .cal-btn { background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 28px; height: 26px; cursor: pointer; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-wd { font-size: 10px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
  .cal-day { height: 28px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; color: var(--muted); background: rgba(255,255,255,.02); }
  .cal-day.empty { background: transparent; }
  .cal-day.has { color: #fff; cursor: pointer; background: var(--accent-bg); border: 1px solid var(--accent-bd); }
  .cal-day.has-2 { filter: brightness(1.25); }
  .cal-day.selected { outline: 2px solid #00e054; outline-offset: 1px; }
  .cal-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); min-height: 18px; }
  .clear-day { color: #00e054; cursor: pointer; font-weight: 700; }
  .sec-hdr { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 12px; border-radius: 6px; margin-top: 8px; }
  .diary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 6px; border-bottom: 1px solid var(--border); }
  .d-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .day-pill { width: 34px; height: 32px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
  .d-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-tag { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-bd); padding: 2px 8px; border-radius: 5px; flex-shrink: 0; }
  .empty { text-align: center; padding: 28px; color: var(--muted); }
  @media (max-width: 680px) { .top-grid { grid-template-columns: 1fr; } }
</style>
</head>

};

function parseDate(str) {
  const clean = String(str || "").trim();
  const sep = clean.includes(".") ? "." : (clean.includes("/") ? "/" : (clean.includes("-") ? "-" : null));
  if (!sep) return null;
  const p = clean.split(sep);
  if (p.length !== 3) return null;
  let d = p[0], m = p[1], y = p[2];
  if (d.length === 4) { y = p[0]; m = p[1]; d = p[2]; }
  else if (y.length === 2) { y = "20" + y; }
  const mn = Number(m), yn = Number(y), dn = Number(d);
  if (!yn || mn < 1 || mn > 12 || dn < 1 || dn > 31) return null;
  const dd = String(dn).padStart(2, "0"), mm = String(mn).padStart(2, "0");
  return { dd, mn, yn, mName: MONTHS_UPPER[mn - 1], ym: yn + "-" + mm, iso: yn + "-" + mm + "-" + dd };
}

function getDecade(rel) {
  if (!rel) return "unknown";
  return rel < 1980 ? "older" : String(Math.floor(rel / 10) * 10);
}

function decLabel(k) {
  return k === "older" ? "До 1980-х" : (k === "unknown" ? "Без года" : k + "-е");
}

function parseCategory(key, text) {
  const list = [];
  for (const line of text.split("\n")) {
    const t = line.trim();
    if (!t.startsWith("- ")) continue;
    try {
      const arr = JSON.parse(t.slice(2).trim());
      if (!Array.isArray(arr) || arr.length < 3) continue;
      const di = parseDate(arr[2]);
      if (!di) continue;
      const relStr = arr[1] ? String(arr[1]).trim() : "";
      const relNum = Number(relStr) || 0;
      const rest = arr.slice(3).map(x => String(x || "").trim());
      const low = rest.join(" ").toLowerCase();
      const isRepeat = low.includes("rewatched") || low.includes("replayed") || low.includes("reread");

      let author = "", badge = "";
      if (key === "books") {
        for (const v of rest) {
          if (v && v !== "-" && !/^\d+$/.test(v) && v.toLowerCase() !== "reread") { author = v; break; }
        }
      } else if (key === "shows") {
        const fin = low.includes("ended") || low.includes("finished") || low.includes("completed") || low.includes("закончен");
        if (!fin) {
          for (const v of rest) {
            if (/^\d+$/.test(v)) { badge = "S" + v; break; }
            if (/^s\d+$/i.test(v)) { badge = v.toUpperCase(); break; }
          }
        }
      } else {
        for (const v of rest) {
          if (/^([1-9](\.\d)?|10(\.0)?)$/.test(v)) { badge = "★ " + v; break; }
        }
      }
      list.push({ title: String(arr[0] || "").trim(), relStr, relNum, decade: getDecade(relNum), di, isRepeat, author, badge });
    } catch (e) {}
  }
  return list.sort((a, b) => b.di.iso.localeCompare(a.di.iso));
}

const DB = {
  movies: parseCategory("movies", RAW.movies),
  games:  parseCategory("games",  RAW.games),
  shows:  parseCategory("shows",  RAW.shows),
  books:  parseCategory("books",  RAW.books)
};

let st = { q: "", year: "all", month: "all", decade: "all", author: "all", rep: false, day: null }; let calY = new Date().getFullYear(), calM = new Date().getMonth() + 1;

function setCat(newCat) {  
cat = newCat;  
st = { q: "", year: "all", month: "all", decade: "all", author: "all", rep: false, day: null };  
const items = DB[cat];  
if (items.length) { calY = items[0].di.yn; calM = items[0].di.mn; }  
const m = META[cat];  
document.documentElement.style.setProperty("--accent", m.color);  
document.documentElement.style.setProperty("--accent-bg", m.bg);  
document.documentElement.style.setProperty("--accent-bd", m.bd);  
render();  
}

function render() {  
const root = document.getElementById("app");  
const items = DB[cat];  
const byDay = {};  
const yearsSet = new Set([new Date().getFullYear()]);  
items.forEach(x => { byDay[x.di.iso] = (byDay[x.di.iso] || 0) + 1; yearsSet.add(x.di.yn); });

const match = (x, ign) => {  
if (st.day && ign !== "day" && x.di.iso !== st.day) return false;  
if (st.q && !x.title.toLowerCase().includes(st.q) && !x.author.toLowerCase().includes(st.q)) return false;  
if (st.year !== "all" && ign !== "year" && String(x.di.yn) !== st.year) return false;  
if (st.month !== "all" && ign !== "month" && String(x.di.mn) !== st.month) return false;  
if (st.decade !== "all" && ign !== "decade" && x.decade !== st.decade) return false;  
if (st.author !== "all" && ign !== "author" && x.author !== st.author) return false;  
if (st.rep && !x.isRepeat) return false;  
return true;  
};

const availY = [...new Set(items.filter(x => match(x, "year")).map(x => x.di.yn))].sort((a,b) => b - a);  
const availM = [...new Set(items.filter(x => match(x, "month")).map(x => x.di.mn))].sort((a,b) => a - b);  
const availD = [...new Set(items.filter(x => match(x, "decade")).map(x => x.decade))];  
const availA = [...new Set(items.filter(x => match(x, "author")).map(x => x.author).filter(Boolean))].sort();  
const filtered = items.filter(x => match(x, null));

const firstDay = new Date(calY, calM - 1, 1);  
const offset = (firstDay.getDay() + 6) % 7;  
const daysCnt = new Date(calY, calM, 0).getDate();  
let calCells = DAYS_SHORT.map(w => '' + w + '').join("");  
for (let i = 0; i < offset; i++) calCells += '';  
let mTotal = 0;  
for (let d = 1; d <= daysCnt; d++) {  
const iso = calY + "-" + String(calM).padStart(2,"0") + "-" + String(d).padStart(2,"0");  
const c = byDay[iso] || 0;  
mTotal += c;  
const cls = "cal-day" + (c ? " has" + (c > 1 ? " has-2" : "") : "") + (st.day === iso ? " selected" : "");  
calCells += '<div class="' + cls + '" data-day="' + (c ? iso : "") + '">' + d + '';  
}

let diaryHtml = "";  
if (!filtered.length) diaryHtml = 'Ничего не найдено';  
else {  
let curYm = "";  
for (const x of filtered) {  
if (x.di.ym !== curYm) { curYm = x.di.ym; diaryHtml += '' + x.di.mName + ' ' + x.di.yn + ''; }  
diaryHtml += '' + x.di.dd + '' + x.title + '' +  
(x.author ? '• ' + x.author + '' : '') +  
(x.relStr ? '' + x.relStr + '' : '') +  
(x.isRepeat ? REP_SVG : '') + '' +  
(x.badge ? '' + x.badge + '' : '') + '';  
}  
}

const hasF = st.q || st.year !== "all" || st.month !== "all" || st.decade !== "all" || st.author !== "all" || st.rep || st.day;

root.innerHTML =  
'' + Object.entries(META).map(([k, m]) => '' + m.label + '').join("") + '' +  
'' +  
'‹' +  
'' + MONTHS_TITLE.map((n, i) => '<option value="' + (i+1) + '"' + (i+1 === calM ? ' selected' : '') + '>' + n + '').join("") + '' +  
'' + [...yearsSet].sort((a,b)=>b-a).map(y => '<option value="' + y + '"' + (y === calY ? ' selected' : '') + '>' + y + '').join("") + '' +  
'›' + calCells + '' +  
'За месяц: ' + mTotal + '' + (st.day ? 'Дата: ' + st.day.split("-").reverse().join(".") + ' ✕' : '') + '' +  
'' + META[cat].label + '' + filtered.length + ' из ' + items.length + '' +  
'<input id="qIn" placeholder="Поиск..." value="' + st.q.replace(/"/g, """) + '">' +  
'Год (все)' + availY.map(y => '<option value="' + y + '"' + (String(y) === st.year ? ' selected' : '') + '>' + y + '').join("") + '' +  
'Месяц (все)' + availM.map(m => '<option value="' + m + '"' + (String(m) === st.month ? ' selected' : '') + '>' + MONTHS_TITLE[m-1] + '').join("") + '' +  
'' + (cat === "books" ? 'Автор (все)' + availA.map(a => '<option value="' + a.replace(/"/g,""") + '"' + (a === st.author ? ' selected' : '') + '>' + a + '').join("") + '' :  
'Эпоха (все)' + availD.map(d => '<option value="' + d + '"' + (d === st.decade ? ' selected' : '') + '>' + decLabel(d) + '').join("") + '') +  
'' + REP_SVG + '' + META[cat].repWord + '' +  
(hasF ? 'Сбросить фильтры' : '') +  
'' +  
'' + diaryHtml + '';

root.querySelectorAll(".tab").forEach(b => b.onclick = () => setCat(b.dataset.cat));  
root.querySelectorAll(".cal-day.has").forEach(c => c.onclick = () => { st.day = st.day === c.dataset.day ? null : c.dataset.day; render(); });  
document.getElementById("pBtn").onclick = () => { calM--; if (calM < 1) { calM = 12; calY--; } render(); };  
document.getElementById("nBtn").onclick = () => { calM++; if (calM > 12) { calM = 1; calY++; } render(); };  
document.getElementById("cM").onchange = e => { calM = Number(e.target.value); render(); };  
document.getElementById("cY").onchange = e => { calY = Number(e.target.value); render(); };  
if (document.getElementById("clrD")) document.getElementById("clrD").onclick = () => { st.day = null; render(); };

qIn.oninput = e => { st.q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; render(); const n = document.getElementById("qIn"); n.focus(); n.setSelectionRange(pos, pos); };  
document.getElementById("ySel").onchange = e => { st.year = e.target.value; st.day = null; if (st.year !== "all") calY = Number(st.year); render(); };  
document.getElementById("mSel").onchange = e => { st.month = e.target.value; st.day = null; if (st.month !== "all") calM = Number(st.month); render(); };

if (document.getElementById("aSel")) document.getElementById("aSel").onchange = e => { st.author = e.target.value; render(); };  
document.getElementById("rBtn").onclick = () => { st.rep = !st.rep; render(); };

}
