<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abelor's Shelf</title>
<style>
:root { --bg: #161618; --card: #1f1f23; --input: #141416; --border: #2e2e34; --text: #f0f0f3; --muted: #9ca3af; --accent: #38bdf8; --accent-bg: rgba(56,189,248,.18); --accent-bd: rgba(56,189,248,.45); }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 14px 50px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
.wrap { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 14px; }
.site-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.site-title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; background: linear-gradient(90deg, #fff, #7dd3fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
.tabs { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.tab-ico { width: 38px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 9px; cursor: pointer; padding: 0; transition: all .15s ease; }
.tab-ico svg { display: block; flex-shrink: 0; }
.tab-ico:hover { color: #fff; border-color: #4b5563; }
.tab-ico.active { border-color: var(--accent); background: var(--accent-bg); }
.toolbar-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-ico { display: inline-flex; align-items: center; }
.tb-cat { font-size: 15px; font-weight: 800; }
.badge { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-bd); font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.drawer-btn { background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.drawer-btn.has-active, .drawer-btn.open { border-color: var(--accent); background: var(--accent-bg); color: #fff; }
.quick-rst { background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 7px; padding: 5px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
.quick-rst:hover { border-color: var(--accent); color: var(--accent); }
.top-grid { display: grid; grid-template-columns: .95fr 1.05fr; gap: 12px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 13px; display: flex; flex-direction: column; justify-content: center; gap: 9px; }
.card-lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.controls { display: flex; flex-direction: column; gap: 8px; }
.row-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input, select { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.cal-pickers { display: flex; align-items: center; gap: 6px; }
.cal-sel { width: auto; min-width: max-content; padding: 4px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.cal-btn { background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-weight: 700; flex-shrink: 0; }
.toggle { background: var(--input); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.toggle.active { border-color: #00e054; color: #00e054; background: rgba(0,224,84,.08); }
.rep-ico { display: inline-flex; align-items: center; flex-shrink: 0; }
.reset { background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 7px; padding: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
.reset:hover { border-color: var(--accent); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-wd { font-size: 10px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-day { height: 28px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; color: var(--muted); background: rgba(255,255,255,.02); }
.cal-day.empty { background: transparent; }
.cal-day.has { color: #fff; cursor: pointer; background: var(--accent-bg); border: 1px solid var(--accent-bd); }
.cal-day.has-2 { filter: brightness(1.25); }
.cal-day.selected { outline: 2px solid #00e054; outline-offset: 1px; }
.cal-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); min-height: 18px; }
.clear-day { color: #00e054; cursor: pointer; font-weight: 700; }
.sec-hdr { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 12px; border-radius: 6px; margin-top: 8px; }
.diary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 6px; border-bottom: 1px solid var(--border); }
.d-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.day-pill { width: 34px; height: 32px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.d-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-tag { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-bd); padding: 2px 8px; border-radius: 5px; flex-shrink: 0; }
.d-tag.muted { color: var(--muted); background: rgba(255,255,255,.05); border-color: var(--border); font-weight: 600; }
.empty { text-align: center; padding: 28px; color: var(--muted); }
.lbd-wrap { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.lbd-sec-title { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 6px 10px; border-radius: 6px; }
.lbd-grid-2 { display: grid; grid-template-columns: 1.25fr .75fr; gap: 12px; }
.lbd-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.lbd-card-hint { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); opacity: .85; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.lbd-legend { display: inline-flex; align-items: center; gap: 10px; font-size: 10.5px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.lbd-leg-item { display: inline-flex; align-items: center; gap: 4px; }
.lbd-leg-dot { width: 7px; height: 7px; border-radius: 2px; }
.lbd-recent-list { display: flex; flex-direction: column; justify-content: center; gap: 9px; }
.lbd-recent-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
.lbd-pill { width: 4px; height: 28px; border-radius: 3px; flex-shrink: 0; }
.lbd-day-box { width: 34px; height: 34px; border: 1px solid var(--border); background: var(--input); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1; }
.lbd-day-num { font-size: 12.5px; font-weight: 700; color: var(--text); }
.lbd-day-mon { font-size: 8.5px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin-top: 2px; }
.lbd-recent-main { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.lbd-recent-title { font-size: 14.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbd-recent-rel { font-size: 13px; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
.lbd-donut-card { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 10px; }
.lbd-donut-box { display: flex; align-items: center; justify-content: center; position: relative; min-height: 146px; width: 100%; }
.lbd-donut-seg { cursor: pointer; transition: opacity .15s ease, stroke-width .15s ease; }
.lbd-donut-seg:hover { opacity: .85; stroke-width: 21; }
.lbd-donut-center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.lbd-donut-num { font-size: 23px; font-weight: 800; color: var(--text); line-height: 1.1; }
.lbd-donut-lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.lbd-ratio-box { width: 100%; display: flex; flex-direction: column; gap: 5px; padding-top: 6px; border-top: 1px solid var(--border); }
.lbd-ratio-labels { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); }
.lbd-ratio-rep-lbl { color: #00e054; margin-left: auto; }
.lbd-ratio-track { width: 100%; height: 7px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; display: flex; cursor: pointer; }
.lbd-ratio-new { height: 100%; background: #6b7280; transition: filter .15s ease; }
.lbd-ratio-rep { height: 100%; background: #00e054; transition: filter .15s ease; }
.lbd-ratio-track:hover .lbd-ratio-new, .lbd-ratio-track:hover .lbd-ratio-rep { filter: brightness(1.15); }
.lbd-quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-top: 6px; }
.lbd-q-col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.lbd-q-bars { height: 95px; display: flex; align-items: flex-end; justify-content: center; gap: 5px; width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.lbd-q-bar { width: 11px; border-radius: 3px 3px 0 0; min-height: 4px; cursor: pointer; transition: filter .15s ease, transform .15s ease; }
.lbd-q-bar:hover { filter: brightness(1.15); transform: translateY(-1px); }
.lbd-q-lbl { font-size: 11.5px; font-weight: 700; color: var(--text); line-height: 1.1; }
.lbd-q-sub { font-size: 10px; color: var(--muted); opacity: .75; line-height: 1.1; white-space: nowrap; }
.lbd-tot-card { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
.lbd-tot-list { display: flex; flex-direction: column; justify-content: center; gap: 11px; flex: 1; }
.lbd-tot-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.lbd-tot-row:hover .lbd-tot-fill { filter: brightness(1.12); }
.lbd-tot-lbl { width: 58px; font-size: 12.5px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
.lbd-tot-track { flex: 1; height: 14px; background: rgba(255,255,255,.04); border-radius: 4px; overflow: hidden; display: flex; align-items: center; }
.lbd-tot-fill { height: 100%; border-radius: 4px; transition: filter .15s ease; }
.lbd-tot-val { width: 38px; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--text); flex-shrink: 0; }
.lbd-yrs-list { display: flex; flex-direction: column; gap: 7px; max-height: 280px; overflow-y: auto; padding-right: 2px; }
.lbd-yr-row { display: flex; align-items: center; gap: 10px; }
.lbd-yr-lbl { width: 36px; font-size: 12px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
.lbd-yr-track { flex: 1; height: 13px; background: rgba(255,255,255,.04); border-radius: 4px; overflow: hidden; display: flex; min-width: 0; }
.lbd-yr-seg { height: 100%; cursor: pointer; transition: filter .15s ease; }
.lbd-yr-seg:hover { filter: brightness(1.15); }
.lbd-yr-val { width: 40px; text-align: right; font-size: 11.5px; font-weight: 600; color: var(--muted); flex-shrink: 0; }
.lbd-tooltip { position: fixed; z-index: 999999; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s ease, transform .12s ease; background: rgba(24,24,26,.96); border: 1px solid #3a3a3e; border-radius: 8px; padding: 8px 11px; box-shadow: 0 8px 24px rgba(0,0,0,.65); backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #f0f0f0; white-space: nowrap; }
.lbd-tooltip.visible { opacity: 1; transform: translateY(0); }
.lbd-tt-top { display: flex; align-items: center; gap: 8px; }
.lbd-tt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.lbd-tt-cat { font-weight: 700; color: #ffffff; }
.lbd-tt-val { color: #b0b0b0; font-weight: 500; }
.lbd-tt-pct { background: rgba(255,255,255,.08); color: #e4e4e7; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: auto; }
.lbd-tt-sub { font-size: 11px; color: #9ca3af; padding-left: 16px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.lbd-tt-rep { color: #00e054; font-weight: 600; }
.lbd-tt-cat-item { display: inline-flex; align-items: center; gap: 4px; }
.lbd-tt-cat-item i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
@media (max-width: 680px) { .top-grid, .lbd-grid-2 { grid-template-columns: 1fr; } .lbd-q-bar { width: 9px; } .site-title { font-size: 19px; } .tab-ico { width: 34px; height: 34px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function clientApp(DB) {
    (function setPngFavicon() {
      try {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#1f1f23";
        ctx.beginPath();
        ctx.roundRect(0, 0, 64, 64, 16);
        ctx.fill();

        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(2, 2, 60, 60, 14);
        ctx.stroke();

        const grad = ctx.createLinearGradient(0, 12, 64, 52);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(1, "#38bdf8");
        ctx.fillStyle = grad;
        ctx.font = "900 40px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("A", 32, 34);

        let link = document.querySelector("link[rel*='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        link.type = "image/png";
        link.href = c.toDataURL("image/png");
      } catch (e) {}
    })();

    const MONTHS_TITLE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DAYS_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const Q_MONTHS = { 1: "Jan – Mar", 2: "Apr – Jun", 3: "Jul – Sep", 4: "Oct – Dec" };
    const CURRENT_YEAR = new Date().getFullYear();
    const MIN_YEAR = CURRENT_YEAR - 10;
    const REL_COLOR = "#58a6a6";

    const ICONS = {
      stats:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
      movies: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2.5"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7.5" x2="7" y2="7.5"/><line x1="2" y1="16.5" x2="7" y2="16.5"/><line x1="17" y1="7.5" x2="22" y2="7.5"/><line x1="17" y1="16.5" x2="22" y2="16.5"/></svg>',
      games:  '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
      shows:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2.5"/><polyline points="17 2 12 7 7 2"/></svg>',
      books:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      repeat: '<svg width="14" height="13" viewBox="0 0 24 24" fill="none" stroke="#00e054" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>'
    };

    const TABS = [
      { key: "stats",  title: "Stats",  color: "#38bdf8", bg: "rgba(56,189,248,.18)",  bd: "rgba(56,189,248,.45)" },
      { key: "movies", title: "Movies", color: "#9b6bcc", bg: "rgba(155,107,204,.22)", bd: "rgba(155,107,204,.45)", repWord: "Rewatched" },
      { key: "games",  title: "Games",  color: "#7bc96f", bg: "rgba(123,201,111,.22)", bd: "rgba(123,201,111,.45)", repWord: "Replayed" },
      { key: "shows",  title: "Shows",  color: "#e55d87", bg: "rgba(229,93,135,.22)",  bd: "rgba(229,93,135,.45)",  repWord: "Rewatched" },
      { key: "books",  title: "Books",  color: "#f39c4b", bg: "rgba(243,156,75,.22)",  bd: "rgba(243,156,75,.45)",  repWord: "Reread" }
    ];

    const STATS_SOURCES = [
      { key: "movies", label: "Movies", color: "#9b6bcc" },
      { key: "shows",  label: "Shows",  color: "#e55d87" },
      { key: "books",  label: "Books",  color: "#f39c4b" },
      { key: "games",  label: "Games",  color: "#7bc96f" }
    ];

    const tooltip = document.createElement("div");
    tooltip.className = "lbd-tooltip";
    document.body.appendChild(tooltip);

    function moveTooltip(e) {
      const pad = 12;
      const rect = tooltip.getBoundingClientRect();
      let x = e.clientX + 14;
      let y = e.clientY - rect.height - 10;
      if (x + rect.width + pad > window.innerWidth) x = e.clientX - rect.width - 14;
      if (y < pad) y = e.clientY + 18;
      tooltip.style.left = Math.max(pad, x) + "px";
      tooltip.style.top = Math.max(pad, y) + "px";
    }

    function bindTooltip(elNode, color, titleText, countStr, pctStr, subNodes) {
      elNode.addEventListener("mouseenter", (e) => {
        tooltip.innerHTML = "";
        const top = el("div", "lbd-tt-top");
        const dot = el("span", "lbd-tt-dot");
        dot.style.background = color;
        top.appendChild(dot);
        top.appendChild(el("span", "lbd-tt-cat", titleText));
        if (countStr) top.appendChild(el("span", "lbd-tt-val", countStr));
        if (pctStr) top.appendChild(el("span", "lbd-tt-pct", pctStr));
        tooltip.appendChild(top);

        if (subNodes && subNodes.length) {
          const sub = el("div", "lbd-tt-sub");
          subNodes.forEach(n => sub.appendChild(n));tooltip.appendChild(sub);  
}  
tooltip.classList.add("visible");  
moveTooltip(e);  
});  
elNode.addEventListener("mousemove", moveTooltip);  
elNode.addEventListener("mouseleave", () => tooltip.classList.remove("visible"));  
}

function formatPct(part, total) {  
if (!total || part <= 0) return "";  
const val = (part / total) * 100;  
return (Number.isInteger(val) ? val : val.toFixed(1)) + "%";  
}

function makeSubNodes(nw, rep, total) {  
const nodes = [];  
if (nw > 0) {  
const s = el("span");  
s.append("New: ");  
s.appendChild(el("b", "", String(nw)));  
s.append(" (" + formatPct(nw, total) + ")");  
nodes.push(s);  
}  
if (rep > 0) {  
const s = el("span", "lbd-tt-rep");  
s.append("Repeat: ");  
s.appendChild(el("b", "", String(rep)));  
s.append(" (" + formatPct(rep, total) + ")");  
nodes.push(s);  
}  
return nodes;  
}

function makeCatNodes(countsMap) {  
const nodes = [];  
for (const src of STATS_SOURCES) {  
const c = countsMap[src.key] || 0;  
if (c > 0) {  
const item = el("span", "lbd-tt-cat-item");  
const dot = el("i");  
dot.style.background = src.color;  
item.appendChild(dot);  
item.append(src.label + ": ");  
item.appendChild(el("b", "", String(c)));  
nodes.push(item);  
}  
}  
return nodes;  
}

function el(tag, cls, text) {  
const node = document.createElement(tag);  
if (cls) node.className = cls;  
if (text !== undefined && text !== null) node.textContent = String(text);  
return node;  
}

function decLabel(k) {  
return k === "older" ? "Pre-1980s" : (k === "unknown" ? "Unknown year" : k + "s");  
}

function renderRatioBar(container, newCnt, repCnt, scopeLabel) {  
const total = newCnt + repCnt;  
if (total <= 0 || repCnt <= 0) return;  
const newPct = formatPct(newCnt, total);  
const repPct = formatPct(repCnt, total);  
const newWidth = (newCnt / total) * 100;  
const repWidth = (repCnt / total) * 100;

const box = el("div", "lbd-ratio-box");  
const labels = el("div", "lbd-ratio-labels");  
if (newCnt > 0) labels.appendChild(el("span", "", "New " + newPct));  
labels.appendChild(el("span", "lbd-ratio-rep-lbl", "Repeat " + repPct));  
box.appendChild(labels);

const track = el("div", "lbd-ratio-track");  
if (newWidth > 0) {  
const nBar = el("div", "lbd-ratio-new");  
nBar.style.width = newWidth + "%";  
track.appendChild(nBar);  
}  
if (repWidth > 0) {  
const rBar = el("div", "lbd-ratio-rep");  
rBar.style.width = repWidth + "%";  
track.appendChild(rBar);  
}

const countParts = [];  
const pctParts = [];  
if (newCnt > 0) { countParts.push(newCnt); pctParts.push(newPct); }  
if (repCnt > 0) { countParts.push(repCnt); pctParts.push(repPct); }  
bindTooltip(track, "#00e054", scopeLabel + " • New vs Repeat", countParts.join(" / "), pctParts.join(" / "), makeSubNodes(newCnt, repCnt, total));

box.appendChild(track);  
container.appendChild(box);  
}

if (st.day && ign !== "day" && x.di.iso !== st.day) return false;  
if (st.q && !x.title.toLowerCase().includes(st.q) && !x.author.toLowerCase().includes(st.q)) return false;  
if (st.year !== "all" && ign !== "year" && String(x.di.yn) !== st.year) return false;  
if (st.month !== "all" && ign !== "month" && String(x.di.mn) !== st.month) return false;  
if (st.decade !== "all" && ign !== "decade" && x.decade !== st.decade) return false;  
if (st.author !== "all" && ign !== "author" && x.author !== st.author) return false;  
if (st.rep && !x.isRepeat) return false;  
return true;  
};
