<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Diary</title>
<style>
:root { --bg: #161618; --card: #1f1f23; --input: #141416; --border: #2e2e34; --text: #f0f0f3; --muted: #9ca3af; --accent: #9b6bcc; --accent-bg: rgba(155,107,204,.25); --accent-bd: rgba(155,107,204,.45); }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 14px 50px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
.wrap { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 16px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.tab.active { color: #fff; border-color: var(--accent); background: var(--accent-bg); }
.top-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.head-bar { display: flex; align-items: center; justify-content: space-between; }
.title { font-size: 18px; font-weight: 800; }
.badge { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-bd); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.controls { display: flex; flex-direction: column; gap: 8px; }
.row-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input, select { width: 100%; background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 7px 10px; font-size: 13px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.toggle { background: var(--input); border: 1px solid var(--border); color: var(--muted); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.toggle.active { border-color: #00e054; color: #00e054; background: rgba(0,224,84,.08); }
.reset { background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 7px; padding: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
.reset:hover { border-color: var(--accent); color: var(--accent); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.cal-pickers { display: flex; gap: 5px; }
.cal-sel { padding: 3px 7px; font-size: 12px; font-weight: 700; }
.cal-btn { background: var(--input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; width: 28px; height: 26px; cursor: pointer; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-wd { font-size: 10px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-day { height: 28px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; color: var(--muted); background: rgba(255,255,255,.02); }
.cal-day.empty { background: transparent; }
.cal-day.has { color: #fff; cursor: pointer; background: var(--accent-bg); border: 1px solid var(--accent-bd); }
.cal-day.has-2 { filter: brightness(1.25); }
.cal-day.selected { outline: 2px solid #00e054; outline-offset: 1px; }
.cal-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); min-height: 18px; }
.clear-day { color: #00e054; cursor: pointer; font-weight: 700; }
.sec-hdr { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; padding: 6px 12px; border-radius: 6px; margin-top: 8px; }
.diary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 6px; border-bottom: 1px solid var(--border); }
.d-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.day-pill { width: 34px; height: 32px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.d-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-tag { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-bg); border: 1px solid var(--accent-bd); padding: 2px 8px; border-radius: 5px; flex-shrink: 0; }
.empty { text-align: center; padding: 28px; color: var(--muted); }
@media (max-width: 680px) { .top-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function clientApp(DB) {
    const MONTHS_TITLE = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
    const META = {
      movies: { label: "🎬 Movies", color: "#9b6bcc", bg: "rgba(155,107,204,.22)", bd: "rgba(155,107,204,.45)", repWord: "Rewatched" },
      games:  { label: "🎮 Games",  color: "#7bc96f", bg: "rgba(123,201,111,.22)", bd: "rgba(123,201,111,.45)", repWord: "Replayed" },
      shows:  { label: "📺 Shows",  color: "#e55d87", bg: "rgba(229,93,135,.22)",  bd: "rgba(229,93,135,.45)",  repWord: "Rewatched" },
      books:  { label: "📚 Books",  color: "#f39c4b", bg: "rgba(243,156,75,.22)",  bd: "rgba(243,156,75,.45)",  repWord: "Reread" }
    };

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }

    function decLabel(k) {
      return k === "older" ? "До 1980-х" : (k === "unknown" ? "Без года" : k + "-е");
    }

    let cat = "movies";
    let st = { q: "", year: "all", month: "all", decade: "all", author: "all", rep: false, day: null };
    let calY = new Date().getFullYear();
    let calM = new Date().getMonth() + 1;

    function setCat(newCat) {
      cat = newCat;
      st = { q: "", year: "all", month: "all", decade: "all", author: "all", rep: false, day: null };
      const items = DB[cat] || [];
      if (items.length) {
        calY = items.at(0).di.yn;
        calM = items.at(0).di.mn;
      }
      const m = META[cat];
      document.documentElement.style.setProperty("--accent", m.color);
      document.documentElement.style.setProperty("--accent-bg", m.bg);
      document.documentElement.style.setProperty("--accent-bd", m.bd);
      render();
    }

    function render() {
      const root = document.getElementById("app");
      root.innerHTML = "";

      const items = DB[cat] || [];
      const byDay = {};
      const yearsSet = new Set([new Date().getFullYear()]);
      items.forEach(x => {
        byDay[x.di.iso] = (byDay[x.di.iso] || 0) + 1;
        yearsSet.add(x.di.yn);
      });

      const match = (x, ign) => {
        if (st.day && ign !== "day" && x.di.iso !== st.day) return false;
        if (st.q && !x.title.toLowerCase().includes(st.q) && !x.author.toLowerCase().includes(st.q)) return false;
        if (st.year !== "all" && ign !== "year" && String(x.di.yn) !== st.year) return false;
        if (st.month !== "all" && ign !== "month" && String(x.di.mn) !== st.month) return false;
        if (st.decade !== "all" && ign !== "decade" && x.decade !== st.decade) return false;
        if (st.author !== "all" && ign !== "author" && x.author !== st.author) return false;
        if (st.rep && !x.isRepeat) return false;
        return true;
      };

      const availY = [...new Set(items.filter(x => match(x, "year")).map(x => x.di.yn))].sort((a, b) => b - a);
      const availM = [...new Set(items.filter(x => match(x, "month")).map(x => x.di.mn))].sort((a, b) => a - b);
      const availD = [...new Set(items.filter(x => match(x, "decade")).map(x => x.decade))];
      const availA = [...new Set(items.filter(x => match(x, "author")).map(x => x.author).filter(Boolean))].sort();
      const filtered = items.filter(x => match(x, null));

      const tabsBar = el("div", "tabs");
      for (const [k, m] of Object.entries(META)) {
        const b = el("button", k === cat ? "tab active" : "tab", m.label);
        b.onclick = () => setCat(k);
        tabsBar.appendChild(b);
      }
      root.appendChild(tabsBar);

      const topGrid = el("div", "top-grid");

      // Calendar Card
      const calCard = el("div", "card");
      const calNav = el("div", "cal-nav");
      const pBtn = el("button", "cal-btn", "‹");
      pBtn.onclick = () => { calM--; if (calM < 1) { calM = 12; calY--; } render(); };
      calNav.appendChild(pBtn);

      const pickers = el("div", "cal-pickers");
      const cM = el("select", "cal-sel");
      MONTHS_TITLE.forEach((n, i) => {
        const opt = el("option", "", n);
        opt.value = String(i + 1);
        if (i + 1 === calM) opt.selected = true;
        cM.appendChild(opt);
      });
      cM.onchange = () => { calM = Number(cM.value); render(); };
      pickers.appendChild(cM);

      const cY = el("select", "cal-sel");
      [...yearsSet].sort((a, b) => b - a).forEach(y => {
        const opt = el("option", "", String(y));
        opt.value = String(y);
        if (y === calY) opt.selected = true;
        cY.appendChild(opt);
      });
      cY.onchange = () => { calY = Number(cY.value); render(); };
      pickers.appendChild(cY);

      calNav.appendChild(pickers);

      const nBtn = el("button", "cal-btn", "›");
      nBtn.onclick = () => { calM++; if (calM > 12) { calM = 1; calY++; } render(); };
      calNav.appendChild(nBtn);
      calCard.appendChild(calNav);

      const calGrid = el("div", "cal-grid");
      DAYS_SHORT.forEach(w => calGrid.appendChild(el("div", "cal-wd", w)));
      const firstDay = new Date(calY, calM - 1, 1);
      const offset = (firstDay.getDay() + 6) % 7;
      const daysCnt = new Date(calY, calM, 0).getDate();
      for (let i = 0; i < offset; i++) calGrid.appendChild(el("div", "cal-day empty"));

      let mTotal = 0;
      for (let d = 1; d <= daysCnt; d++) {
        const iso = calY + "-" + String(calM).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const c = byDay[iso] || 0;
        mTotal += c;
        let cls = "cal-day";
        if (c > 0) cls += c > 1 ? " has has-2" : " has";
        if (st.day === iso) cls += " selected";
        const cell = el("div", cls, String(d));
        if (c > 0) cell.onclick = () => { st.day = st.day === iso ? null : iso; render(); };
        calGrid.appendChild(cell);
      }
      calCard.appendChild(calGrid);

      const calFoot = el("div", "cal-foot");
      calFoot.appendChild(el("span", "", "За месяц: " + mTotal));
      if (st.day) {
        const clr = el("span", "clear-day", "Дата: " + st.day.split("-").reverse().join(".") + " ✕");
        clr.onclick = () => { st.day = null; render(); };
        calFoot.appendChild(clr);
      }
      calCard.appendChild(calFoot);
      topGrid.appendChild(calCard);

      // Filter Card
      const fCard = el("div", "card");
      const hBar = el("div", "head-bar");
      hBar.appendChild(el("div", "title", META[cat].label));hBar.appendChild(el("span", "badge", filtered.length + " из " + items.length));  
fCard.appendChild(hBar);

const ctrls = el("div", "controls");  
const qIn = el("input");  
qIn.id = "qIn";  
qIn.placeholder = "Поиск...";  
qIn.value = st.q;  
qIn.oninput = () => {  
st.q = qIn.value.trim().toLowerCase();  
const pos = qIn.selectionStart;  
render();  
const nextIn = document.getElementById("qIn");  
if (nextIn) { nextIn.focus(); nextIn.setSelectionRange(pos, pos); }  
};  
ctrls.appendChild(qIn);

const row1 = el("div", "row-ctrl");  
const ySel = el("select");  
ySel.appendChild(el("option", "", "Год (все)")).value = "all";  
availY.forEach(y => {  
const o = el("option", "", String(y));  
o.value = String(y);  
if (String(y) === st.year) o.selected = true;  
ySel.appendChild(o);  
});  
ySel.onchange = () => { st.year = ySel.value; st.day = null; if (st.year !== "all") calY = Number(st.year); render(); };  
row1.appendChild(ySel);

const mSel = el("select");  
mSel.appendChild(el("option", "", "Месяц (все)")).value = "all";  
availM.forEach(m => {  
const o = el("option", "", MONTHS_TITLE.at(m - 1));  
o.value = String(m);  
if (String(m) === st.month) o.selected = true;  
mSel.appendChild(o);  
});  
mSel.onchange = () => { st.month = mSel.value; st.day = null; if (st.month !== "all") calM = Number(st.month); render(); };  
row1.appendChild(mSel);  
ctrls.appendChild(row1);

const row2 = el("div", "row-ctrl");  
if (cat === "books") {  
const aSel = el("select");  
aSel.appendChild(el("option", "", "Автор (все)")).value = "all";  
availA.forEach(a => {  
const o = el("option", "", a);  
o.value = a;  
if (a === st.author) o.selected = true;  
aSel.appendChild(o);  
});  
aSel.onchange = () => { st.author = aSel.value; render(); };  
row2.appendChild(aSel);  
} else {  
const dSel = el("select");  
dSel.appendChild(el("option", "", "Эпоха (все)")).value = "all";  
availD.forEach(d => {  
const o = el("option", "", decLabel(d));  
o.value = d;  
if (d === st.decade) o.selected = true;  
dSel.appendChild(o);  
});  
dSel.onchange = () => { st.decade = dSel.value; render(); };  
row2.appendChild(dSel);  
}

const rBtn = el("button", st.rep ? "toggle active" : "toggle", "↻ " + META[cat].repWord);  
rBtn.onclick = () => { st.rep = !st.rep; render(); };  
row2.appendChild(rBtn);  
ctrls.appendChild(row2);

const hasF = st.q || st.year !== "all" || st.month !== "all" || st.decade !== "all" || st.author !== "all" || st.rep || st.day;  
if (hasF) {  
const rst = el("button", "reset", "Сбросить фильтры");  
rst.onclick = () => setCat(cat);  
ctrls.appendChild(rst);  
}

fCard.appendChild(ctrls);  
topGrid.appendChild(fCard);  
root.appendChild(topGrid);

// Diary List  
const listBox = el("div");  
if (!filtered.length) {  
listBox.appendChild(el("div", "empty", "Ничего не найдено"));  
} else {  
let curYm = "";  
for (const x of filtered) {  
if (x.di.ym !== curYm) {  
curYm = x.di.ym;  
listBox.appendChild(el("div", "sec-hdr", x.di.mName + " " + x.di.yn));  
}  
const row = el("div", "diary-row");  
const left = el("div", "d-left");  
left.appendChild(el("div", "day-pill", x.di.dd));  
left.appendChild(el("div", "d-title", x.title));  
if (x.author) left.appendChild(el("span", "d-sub", "• " + x.author));  
if (x.relStr) left.appendChild(el("span", "d-sub", x.relStr));  
if (x.isRepeat) {  
const repSpan = el("span", "", "↻");  
repSpan.style.color = "#00e054";  
repSpan.style.fontWeight = "700";  
left.appendChild(repSpan);  
}  
row.appendChild(left);  
if (x.badge) row.appendChild(el("span", "d-tag", x.badge));  
listBox.appendChild(row);  
}  
}  
root.appendChild(listBox);  
}

setCat("movies");
